name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'cryptography>=44,<47'
      - run: python3 scripts/check_conformance.py --check-report conformance/coverage.json
      - run: python3 -m unittest scripts.tests.test_check_conformance -v
      - run: python3 -m unittest discover -s independent/python/tests -v
      - run: python3 scripts/run_interop_matrix.py --output /tmp/interop-matrix-v1.json
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

[workspace]
resolver = "2"
members = [
    "crates/cofferwire-codec",
    "crates/cofferwire-client",
    "crates/cofferwire-crypto",
    "crates/cofferwire-relay",
    "crates/cofferwire-test",
    "crates/cofferwire-types",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.84"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

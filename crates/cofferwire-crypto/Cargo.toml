[package]
name = "cofferwire-crypto"
version = "0.1.0"
description = "Fixed cryptographic profile for Cofferwire v1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cofferwire-types = { path = "../cofferwire-types" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hpke = { version = "=0.11.0", default-features = false, features = ["alloc", "std", "x25519"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[lints]
workspace = true

[package]
name = "cofferwire-test"
version = "0.1.0"
description = "Cofferwire specification conformance tests and public vectors"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
cddl = "=0.10.2"
chacha20poly1305 = "0.10.1"
cofferwire-client = { path = "../cofferwire-client" }
cofferwire-crypto = { path = "../cofferwire-crypto" }
cofferwire-types = { path = "../cofferwire-types" }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hkdf = "0.12.4"
serde_json = "1.0.140"
sha2 = "0.10.8"

# cddl 0.10.2 permits newer transitive releases whose MSRV exceeds the
# workspace Rust 1.84 baseline. Exact direct constraints keep this test
# harness reproducible on the documented toolchain.
base45 = "=3.1.0"
clap = "=4.5.31"
time = "=0.3.36"
unicode-segmentation = "=1.12.0"

[lints]
workspace = true
